[package]
name = "qtv-vrf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The verifiable random function for Quantova, built from NIST post quantum hash primitives as a one time key construction that commits a Merkle root over the per position secrets."
repository = "https://github.com/Quantova/QVRF"
rust-version = "1.75"

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "387c01dee92bd3a7e5a6bf5a1480745ccafa0d5f" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "6ae7029a07f0f039d3de4633d6712b79a7135dd9" }

[dev-dependencies]
