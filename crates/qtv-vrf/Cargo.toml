[package]
name = "qtv-vrf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The verifiable random function for Quantova, built from NIST post quantum hash primitives as a one time key construction that commits a Merkle root over the per position secrets."
repository = "https://github.com/Quantova/QVRF"
rust-version = "1.75"

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "12fefda211c5b7f8a8e9ed60e6a35d880da54c38" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "bddf924e8e702bf72fd905b66558452c26520831" }

[dev-dependencies]
