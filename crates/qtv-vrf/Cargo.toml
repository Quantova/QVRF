[package]
name = "qtv-vrf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The verifiable random function for Quantova, built from NIST post quantum hash primitives as a one time key construction that commits a Merkle root over the per position secrets."
repository = "https://github.com/Quantova/QVRF"
rust-version = "1.75"

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "986b7f75417ff0731bedb940e03e9ff0ebd55bec" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "b46d022b3d80f06931f532405c81eaf87c0e00f8" }

[dev-dependencies]
