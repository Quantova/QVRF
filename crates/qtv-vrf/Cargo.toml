[package]
name = "qtv-vrf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The verifiable random function for Quantova, built from NIST post quantum hash primitives as a one time key construction that commits a Merkle root over the per position secrets."
repository = "https://github.com/Quantova/QVRF"
rust-version = "1.75"

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4abe71e9fa84a6e670e6d5736d7533c3fd10a3ed" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "20bbbf78703f3af8e496579ca1fc80181bcbf336" }

[dev-dependencies]
