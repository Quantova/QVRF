[package]
name = "qtv-vrf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The verifiable random function for Quantova, built from NIST post quantum hash primitives as a one time key construction that commits a Merkle root over the per position secrets."
repository = "https://github.com/Quantova/QVRF"
rust-version = "1.75"

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "44d820804a3d30cac41238b1dab1ca71bd195bf4" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "fcb670d61be5b6b7dd036b5ebf002ec7f215882b" }

[dev-dependencies]
